# Re-runs Architecture review when basita-yousef reviews (BASITA-150). It decides nothing itself.
name: Architecture review re-run

on:
  pull_request_review:
    types: [submitted, edited, dismissed]

permissions:
  actions: write

jobs:
  rerun:
    uses: ./.github/workflows/reusable-architecture-review-rerun.yml
    with:
      reviewer: basita-yousef
