# Re-runs Architecture review when the reviewer submits, edits or has a review dismissed.
#
# pull_request_review runs the workflow file from the pull request, so a PR could change this one.
# That is why it decides nothing: it only asks GitHub to re-run the trusted pull_request_target run
# on the PR's head commit, which reads the new review itself. If a PR breaks this workflow, the
# check just stays red until the next push or label, which is safe. On a PR from a fork the token
# is read-only, the re-run is refused and the check stays red the same way.
#
#   # .github/workflows/architecture-review-rerun.yml
#   on:
#     pull_request_review:
#       types: [submitted, edited, dismissed]
#   permissions:
#     actions: write   # to re-run the Architecture review run
#   jobs:
#     rerun:
#       uses: ahmedoraby-eng/engineering-playbook/.github/workflows/reusable-architecture-review-rerun.yml@main
#       with:
#         reviewer: basita-yousef   # the same login as architecture_review.reviewer in review-rules.json
name: Reusable architecture review re-run

on:
  workflow_call:
    inputs:
      reviewer:
        description: GitHub login of the reviewer; other people's reviews re-run nothing
        type: string
        required: true
      workflow:
        description: File name of the consuming repo's Architecture review workflow
        type: string
        default: architecture-review.yml

permissions:
  actions: write

jobs:
  rerun:
    name: Re-run Architecture review
    if: github.event.review.user.login == inputs.reviewer
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Re-run the check on the head commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          WORKFLOW: ${{ inputs.workflow }}
        run: |
          set -euo pipefail
          # A run still in progress may have read the reviews before this one: wait for it to finish.
          for attempt in 1 2 3 4 5 6 7 8; do
            run=$(gh api "repos/$REPO/actions/workflows/$WORKFLOW/runs?event=pull_request_target&head_sha=$HEAD_SHA&per_page=1" \
              --jq '.workflow_runs[0] // empty | "\(.id) \(.status)"')
            if [ -z "$run" ]; then
              echo "No Architecture review run on ${HEAD_SHA:0:7} yet; the next push or label runs it."
              exit 0
            fi
            read -r id status <<<"$run"
            if [ "$status" = "completed" ]; then
              gh api -X POST "repos/$REPO/actions/runs/$id/rerun" >/dev/null
              echo "Re-ran Architecture review run $id on ${HEAD_SHA:0:7}."
              exit 0
            fi
            sleep 15
          done
          echo "::error::Architecture review run $id on ${HEAD_SHA:0:7} is still $status after 2 minutes; re-run it by hand."
          exit 1
