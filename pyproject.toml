[project]
name = "ai-guard"
version = "0.1.0"
description = "Pull-request guardrails for AI-assisted engineering"
requires-python = ">=3.11"
license = { text = "MIT" }

[project.scripts]
ai-guard = "ai_guard.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["ai_guard", "helpers"]
